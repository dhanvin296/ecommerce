<!doctype html>
<html lang="hi">
<head>
  <link rel="icon" type="image/png" href="/favicon.png">
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#f4e7d0">
  <title>Dhanvin Online | Havan Samagri & Puja Essentials</title>
  <meta name="description" content="Shop authentic Havan Samagri and traditional Puja essentials online at Dhanvin Online.">
  <meta name="robots" content="index, follow, max-image-preview:large">
  <link rel="canonical" href="https://dhanvin.online/">

  <style>
    :root{
      --gold:#b56a00;
      --gold-2:#e08a00;
      --cream:#24180d;
      --ink:#100903;
      --line:rgba(91,61,25,.18);
      --glass:rgba(255,255,255,.72);
      --surface:#ffffff;
      --surface-2:#fffaf1;
      --muted:#6f6254;
      --shadow:0 18px 50px rgba(80,52,18,.12);
      --nav-h:66px;
    }

    *{box-sizing:border-box}
    html{scroll-behavior:smooth}
    body{
      margin:0;
      color:var(--cream);
      font-family:"Noto Sans Devanagari","Nirmala UI","Segoe UI",sans-serif;
      background:linear-gradient(180deg,#fffdf9 0%,#f7f1e8 100%);
      overflow-x:hidden;
      scrollbar-width:none;
    }
    body::-webkit-scrollbar{display:none}
    img{max-width:100%}
    a{-webkit-tap-highlight-color:transparent}

    /* =========================
       MOBILE-FIRST NAVIGATION
       ========================= */
    .nav{
      position:fixed;
      top:max(10px,env(safe-area-inset-top));
      left:50%;
      transform:translateX(-50%);
      width:min(1120px,calc(100% - 24px));
      min-height:var(--nav-h);
      z-index:100;
      display:flex;
      align-items:center;
      justify-content:space-between;
      gap:14px;
      padding:9px 12px 9px 18px;
      border:1px solid rgba(91,61,25,.16);
      border-radius:20px;
      background:rgba(255,255,255,.82);
      backdrop-filter:blur(14px) saturate(125%);
      -webkit-backdrop-filter:blur(14px) saturate(125%);
      box-shadow:0 12px 40px rgba(80,52,18,.12),inset 0 1px rgba(255,255,255,.8);
    }
    .brand{
      color:var(--gold);
      font-size:1.04rem;
      font-weight:800;
      letter-spacing:.12em;
      white-space:nowrap;
      text-shadow:0 2px 12px rgba(243,198,107,.16);
    }
    .nav-links{
      display:flex;
      align-items:center;
      gap:4px;
    }
    .nav-links a{
      color:#3f3225;
      text-decoration:none;
      font-size:.86rem;
      padding:10px 12px;
      border-radius:12px;
      opacity:.92;
    }
    .nav-links a:hover{color:var(--gold);background:rgba(243,198,107,.07)}
    .menu-toggle{
      display:none;
      width:42px;
      height:42px;
      border:1px solid rgba(255,235,190,.25);
      border-radius:12px;
      background:rgba(255,255,255,.045);
      color:#3f3225;
      cursor:pointer;
    }
    .menu-toggle span,
    .menu-toggle span::before,
    .menu-toggle span::after{
      display:block;
      width:18px;
      height:2px;
      margin:auto;
      border-radius:99px;
      background:currentColor;
      transition:transform .22s ease,opacity .22s ease;
    }
    .menu-toggle span::before,
    .menu-toggle span::after{content:""}
    .menu-toggle span::before{transform:translateY(-6px)}
    .menu-toggle span::after{transform:translateY(4px)}
    .nav.open .menu-toggle span{transform:rotate(45deg)}
    .nav.open .menu-toggle span::before{transform:translateY(0) rotate(90deg)}
    .nav.open .menu-toggle span::after{opacity:0}

    /* =========================
       HERO — THREE VISUAL LAYERS
       1 = mountain background
       1.5 = rising sun + OM
       2 = temple foreground
       ========================= */
    .hero{
      min-height:100svh;
      padding:calc(var(--nav-h) + 30px) 16px 70px;
      text-align:center;
      position:relative;
      isolation:isolate;
    }
    .hero-scene{
      position:relative;
      width:min(1380px,100%);
      height:clamp(470px,62vw,760px);
      margin:0 auto;
      overflow:hidden;
      isolation:isolate;
      border-radius:0;
      background:transparent;
    }
    .hero-bg{
      position:absolute;
      inset:0;
      z-index:1;
      width:100%;
      height:100%;
      object-fit:cover;
      object-position:center;
      display:block;
      user-select:none;
      pointer-events:none;
      transform:translateZ(0);
    }
    .hero-scene::after{
      content:"";
      position:absolute;
      inset:0;
      z-index:4;
      pointer-events:none;
      background:
        linear-gradient(180deg,rgba(255,255,255,.02) 0%,transparent 34%,rgba(67,39,10,.08) 74%,rgba(67,39,10,.24) 100%),
        radial-gradient(circle at 50% 43%,transparent 30%,rgba(255,255,255,.10) 100%);
    }

    /* The sun intentionally sits BETWEEN the background and temple.
       The temple overlaps its lower/central area to create the
       requested "rising behind the temple" look. */
    .sun-orb{
      --sun-size:clamp(250px,31vw,430px);
      position:absolute;
      z-index:2;
      left:50%;
      top:clamp(62px,9vw,120px);
      width:var(--sun-size);
      height:var(--sun-size);
      transform:translateX(-50%);
      border-radius:50%;
      display:grid;
      place-items:center;
      isolation:isolate;
      background:
        radial-gradient(circle at 50% 48%,rgba(255,249,202,.98) 0 17%,rgba(255,215,102,.98) 18% 38%,rgba(255,159,37,.55) 54%,rgba(255,123,18,.10) 70%,transparent 72%),
        radial-gradient(circle,rgba(255,196,66,.30),transparent 70%);
      box-shadow:
        0 0 35px rgba(255,203,92,.72),
        0 0 100px rgba(255,146,26,.38);
      animation:sunBreath 3.6s ease-in-out infinite alternate;
      pointer-events:none;
    }
    .sun-orb::before{
      content:"";
      position:absolute;
      inset:-10px;
      border-radius:50%;
      z-index:-1;
      background:conic-gradient(
        from 0deg,
        rgba(255,237,160,.15),
        rgba(255,135,22,.82),
        rgba(255,235,135,.18),
        rgba(255,115,12,.86),
        rgba(255,237,160,.15)
      );
      filter:blur(7px);
      animation:sunSpin 14s linear infinite;
    }
    .sun-ring{
      position:absolute;
      inset:9%;
      border:2px solid rgba(255,231,137,.62);
      border-radius:50%;
      box-shadow:0 0 18px rgba(255,160,26,.55),inset 0 0 18px rgba(255,198,64,.26);
    }
    .sun-om{
      position:relative;
      z-index:3;
      margin-top:-3%;
      color:#fff1b1;
      font-family:"Noto Sans Devanagari","Nirmala UI",serif;
      font-size:clamp(6rem,13.5vw,10.5rem);
      line-height:.75;
      text-shadow:
        0 0 12px rgba(255,255,220,.95),
        0 0 35px rgba(255,165,34,.85),
        0 0 80px rgba(255,134,16,.45);
      animation:omPulse 2.5s ease-in-out infinite alternate;
    }
    .flame-ring{
      position:absolute;
      inset:-2%;
      border-radius:50%;
      animation:flameRing 18s linear infinite;
    }
    .flame{
      position:absolute;
      left:50%;
      top:50%;
      width:13px;
      height:24px;
      transform:
        rotate(var(--a))
        translateY(calc(var(--sun-size) * -.52))
        rotate(45deg);
      transform-origin:50% 0;
      border-radius:70% 30% 70% 30%;
      background:linear-gradient(135deg,#fff4ad 0 20%,#ffb52e 42%,#ff5a10 78%,transparent 79%);
      filter:drop-shadow(0 0 5px rgba(255,142,25,.9));
      animation:flameFlicker 1.1s ease-in-out infinite alternate;
      animation-delay:var(--d);
    }

    .temple{
      position:absolute;
      z-index:3;
      left:50%;
      bottom:-2%;
      width:min(1040px,96%);
      height:88%;
      transform:translateX(-50%);
      object-fit:contain;
      object-position:center bottom;
      display:block;
      filter:drop-shadow(0 20px 26px rgba(0,0,0,.30));
      user-select:none;
      pointer-events:none;
    }

    .hero-copy{
      position:relative;
      z-index:6;
      max-width:850px;
      margin:-5px auto 0;
    }
    .eyebrow{
      margin:0 0 12px;
      color:#9a5d08;
      letter-spacing:.24em;
      text-transform:uppercase;
      font-size:.72rem;
    }
    h1{
      font-size:clamp(2rem,5vw,4.35rem);
      line-height:1.04;
      letter-spacing:-.05em;
      margin:0 0 12px;
    }
    .subtitle{
      max-width:700px;
      margin:0 auto;
      color:#6f6254;
      opacity:.86;
      font-size:1rem;
      line-height:1.7;
    }

    @keyframes sunBreath{from{filter:brightness(.96);transform:translateX(-50%) scale(.985)}to{filter:brightness(1.12);transform:translateX(-50%) scale(1.025)}}
    @keyframes sunSpin{to{transform:rotate(360deg)}}
    @keyframes omPulse{from{filter:brightness(.92);transform:scale(.98)}to{filter:brightness(1.2);transform:scale(1.035)}}
    @keyframes flameRing{to{transform:rotate(360deg)}}
    @keyframes flameFlicker{from{opacity:.65;scale:.82 .9}to{opacity:1;scale:1.12 1.22}}

    /* =========================
       MANTRA / LOWER CONTENT
       ========================= */
    .mantra-stage{
      position:relative;
      z-index:6;
      width:min(900px,100%);
      min-height:190px;
      margin:42px auto 0;
      display:flex;
      flex-direction:column;
      align-items:center;
      justify-content:center;
      padding:28px 20px;
      border:1px solid var(--line);
      border-radius:30px;
      background:rgba(255,255,255,.68);
      box-shadow:0 24px 90px rgba(80,52,18,.10),inset 0 1px rgba(255,255,255,.8);
      backdrop-filter:blur(9px);
      -webkit-backdrop-filter:blur(9px);
    }
    .mantra-om{
      color:var(--gold);
      font-size:2.1rem;
      opacity:0;
      transform:scale(.55);
    }
    .mantra-om.show{animation:omIn .9s cubic-bezier(.2,.8,.2,1) forwards}
    .mantra-text{
      margin-top:9px;
      font-size:clamp(1.15rem,3vw,1.85rem);
      line-height:1.75;
      min-height:3.4em;
      opacity:0;
      transform:translateY(18px);
      text-shadow:0 2px 15px rgba(80,52,18,.10);
    }
    .mantra-text.show{animation:lineIn 1.05s ease forwards}
    @keyframes omIn{0%{opacity:0;transform:scale(.5)}55%{opacity:1;transform:scale(1.18)}100%{opacity:1;transform:scale(1)}}
    @keyframes lineIn{to{opacity:1;transform:translateY(0)}}

    .section{
      padding:85px 0 110px;
      background:linear-gradient(180deg,#fffaf2,#f5ecdf);
      content-visibility:auto;
      contain-intrinsic-size:900px;
    }
    .section-title{text-align:center;margin-bottom:28px;padding:0 20px}
    .section-title h2{font-size:clamp(1.8rem,4vw,3rem);margin:0 0 8px}
    .section-title p{margin:0;color:#ead9bb;opacity:.8}

    .marquee-wrap{
      overflow:hidden;
      width:100%;
      mask-image:linear-gradient(90deg,transparent,#000 7%,#000 93%,transparent);
      -webkit-mask-image:linear-gradient(90deg,transparent,#000 7%,#000 93%,transparent);
      margin:18px 0;
    }
    .marquee{
      display:flex;
      width:max-content;
      gap:18px;
      animation:scroll 30s linear infinite;
      padding:4px 0;
      will-change:transform;
    }
    .marquee.reverse{animation-direction:reverse;animation-duration:34s}
    .marquee.slow{animation-duration:42s}
    @keyframes scroll{from{transform:translate3d(0,0,0)}to{transform:translate3d(-50%,0,0)}}

    .card{
      width:270px;
      height:190px;
      flex:0 0 auto;
      border:1px solid rgba(91,61,25,.14);
      border-radius:24px;
      padding:9px;
      background:rgba(255,255,255,.78);
      box-shadow:0 18px 46px rgba(80,52,18,.10),inset 0 1px rgba(255,255,255,.85);
      transition:transform .25s ease;
    }
    .card:hover{transform:translateY(-7px) rotate(-1deg)}
    .card img{
      width:100%;
      height:100%;
      object-fit:contain;
      border-radius:17px;
      display:block;
      background:#fffaf2;
    }
    .card img{content-visibility:auto}
    .tall{height:230px}
    .wide{width:320px}

    .buy-wrap{
      display:flex;
      justify-content:center;
      align-items:center;
      padding:8px 20px 52px;
      background:rgba(255,255,255,.25);
    }
    .buy-btn{
      display:inline-flex;
      align-items:center;
      justify-content:center;
      min-width:180px;
      height:50px;
      padding:0 28px;
      border:1px solid rgba(243,198,107,.55);
      border-radius:14px;
      background:linear-gradient(135deg,rgba(243,198,107,.16),rgba(118,70,27,.20));
      color:var(--gold);
      font:700 .88rem/1 "Segoe UI",sans-serif;
      letter-spacing:.22em;
      text-decoration:none;
      text-transform:uppercase;
      transition:background .2s ease,border-color .2s ease,transform .2s ease;
    }
    .buy-btn::after{content:"→";margin-left:12px;font-size:1rem}
    .buy-btn:hover{background:rgba(243,198,107,.18);border-color:rgba(243,198,107,.82);transform:translateY(-2px)}

    footer{
      text-align:center;
      padding:30px 20px 45px;
      color:#756656;
      font-size:.82rem;
      background:#f0e5d5;
      border-top:1px solid rgba(91,61,25,.12);
    }
    .mpoxel-link{color:var(--gold);text-decoration:none;font-weight:700}

    .seo-context{
      position:absolute;
      width:1px;height:1px;padding:0;margin:-1px;
      overflow:hidden;clip:rect(0,0,0,0);
      white-space:nowrap;border:0;
    }

    /* =========================
       MOBILE
       ========================= */
    @media (max-width:700px){
      :root{--nav-h:56px}
      .nav{
        width:calc(100% - 16px);
        min-height:56px;
        padding:7px 8px 7px 13px;
        border-radius:16px;
        backdrop-filter:blur(8px);
        -webkit-backdrop-filter:blur(8px);
      }
      .brand{font-size:.84rem;letter-spacing:.08em}
      .menu-toggle{display:block}
      .nav-links{
        position:absolute;
        top:calc(100% + 8px);
        left:0;
        right:0;
        display:grid;
        gap:4px;
        padding:8px;
        border:1px solid rgba(255,235,190,.2);
        border-radius:16px;
        background:rgba(17,10,5,.96);
        box-shadow:0 18px 45px rgba(0,0,0,.3);
        opacity:0;
        visibility:hidden;
        transform:translateY(-7px) scale(.98);
        transform-origin:top;
        transition:opacity .18s ease,transform .18s ease,visibility .18s;
      }
      .nav.open .nav-links{
        opacity:1;
        visibility:visible;
        transform:translateY(0) scale(1);
      }
      .nav-links a{
        font-size:.82rem;
        padding:12px;
        text-align:center;
      }

      .hero{
        padding:calc(var(--nav-h) + 18px) 8px 48px;
      }
      .hero-scene{
        height:clamp(370px,112vw,520px);
        border-radius:0;
        background:transparent;
      }
      .hero-bg{object-position:center}
      .sun-orb{
        --sun-size:min(61vw,260px);
        top:clamp(42px,11vw,82px);
      }
      .flame{
        width:9px;
        height:17px;
      }
      .temple{
        width:124%;
        max-width:none;
        height:76%;
        bottom:-1%;
      }
      .hero-copy{margin-top:-2px}
      .eyebrow{font-size:.61rem;letter-spacing:.15em}
      h1{font-size:clamp(1.65rem,8.2vw,2.35rem);letter-spacing:-.035em}
      .subtitle{font-size:.88rem;line-height:1.55}
      .mantra-stage{
        min-height:165px;
        margin-top:28px;
        padding:22px 12px;
        border-radius:22px;
        backdrop-filter:none;
        -webkit-backdrop-filter:none;
        background:rgba(244,231,208,.90);
      }
      .mantra-text{
        max-width:100%;
        font-size:clamp(1rem,4.5vw,1.35rem);
        overflow-wrap:anywhere;
      }
      .section{padding:62px 0 78px}
      .section-title h2{font-size:clamp(1.55rem,7vw,2.2rem)}
      .section-title p{font-size:.88rem}
      .marquee-wrap{
        mask-image:none;
        -webkit-mask-image:none;
      }
      .marquee{gap:12px;animation-duration:38s}
      .marquee.reverse{animation-duration:42s}
      .marquee.slow{animation-duration:50s}
      .card{
        width:220px;
        height:155px;
        border-radius:18px;
        padding:7px;
        box-shadow:0 8px 22px rgba(0,0,0,.18);
        background:rgba(22,14,8,.62);
      }
      .wide{width:260px}
      .tall{height:195px}
      .buy-wrap{padding-left:12px;padding-right:12px}
      .buy-btn{min-width:165px;height:48px;padding:0 22px}
    }

    /* =========================
       LIGHT THEME FINISH
       ========================= */
    ::selection{background:rgba(224,138,0,.18);color:#24180d}
    :focus-visible{outline:2px solid var(--gold-2);outline-offset:3px}
    .nav-links a:hover{color:#9a5d08;background:rgba(224,138,0,.08)}
    .buy-btn{box-shadow:0 8px 24px rgba(181,106,0,.10)}
    .mpoxel-link{color:#9a5d08}

    @media (prefers-reduced-motion:reduce){
      *,*::before,*::after{
        animation-duration:.001ms!important;
        animation-iteration-count:1!important;
        scroll-behavior:auto!important;
      }
    }


    /* =========================================================
       DHANVIN — DEEP CREAM EDITION
       Strict palette: dark cream / warm cream / light cream.
       No white UI, no black text.
       ========================================================= */
    :root{
      --cream-0:#f4e7d0;
      --cream-1:#ead8bb;
      --cream-2:#d5bc96;
      --cream-3:#b99a6e;
      --cream-4:#76583a;
      --cream-5:#4b3522;
      --cream-6:#2b1d12;
      --cream-7:#1d130c;
      --gold:#c5a16b;
      --gold-2:#e0c28f;
      --cream:var(--cream-0);
      --ink:var(--cream-7);
      --line:rgba(234,216,187,.20);
      --glass:rgba(43,29,18,.72);
      --surface:var(--cream-6);
      --surface-2:var(--cream-5);
      --muted:var(--cream-3);
      --shadow:0 24px 70px rgba(29,19,12,.30);
    }

    html{background:var(--cream-7)}
    body{
      color:var(--cream-5);
      background:
        radial-gradient(circle at 50% -10%,rgba(234,216,187,.16),transparent 42%),
        linear-gradient(180deg,var(--cream-6) 0%,var(--cream-7) 100%);
    }

    .nav{
      border:1px solid rgba(234,216,187,.24);
      background:rgba(244,231,208,.88);
      box-shadow:0 18px 55px rgba(29,19,12,.42),inset 0 1px rgba(244,231,208,.10);
    }
    .brand{color:var(--cream-5);text-shadow:0 2px 18px rgba(224,194,143,.18)}
    .nav-links a{color:var(--cream-1)}
    .nav-links a:hover{color:var(--cream-5);background:rgba(234,216,187,.10)}
    .menu-toggle{
      border-color:rgba(234,216,187,.24);
      background:rgba(75,53,34,.06);
      color:var(--cream-5);
    }

    .hero{
      background:transparent;
      position:relative;
      z-index:0;
    }
    .hero-scene{
      background:transparent;
      box-shadow:none;
      border:0;
    }
    .hero-scene::after{
      background:
        linear-gradient(180deg,rgba(29,19,12,.03) 0%,transparent 70%,rgba(29,19,12,.10) 100%),
        radial-gradient(circle at 50% 43%,transparent 32%,rgba(29,19,12,.12) 100%);
    }

    .hero-copy{filter:drop-shadow(0 10px 28px rgba(29,19,12,.28))}
    .eyebrow{color:var(--cream-2)}
    h1{color:var(--cream-5);text-shadow:0 4px 24px rgba(29,19,12,.45)}
    .subtitle{color:var(--cream-5);opacity:.92}

    .mantra-stage{
      border-color:rgba(234,216,187,.24);
      background:
        linear-gradient(135deg,rgba(75,53,34,.86),rgba(43,29,18,.82));
      box-shadow:0 28px 85px rgba(29,19,12,.36),inset 0 1px rgba(244,231,208,.11);
    }
    .mantra-om{color:var(--cream-5);text-shadow:0 0 22px rgba(224,194,143,.22)}
    .mantra-text{color:var(--cream-5);text-shadow:0 3px 18px rgba(29,19,12,.45)}

    .section{
      background:
        radial-gradient(circle at 50% 0%,rgba(234,216,187,.09),transparent 34%),
        linear-gradient(180deg,var(--cream-7) 0%,var(--cream-6) 100%);
    }
    .section-title h2{color:var(--cream-5);text-shadow:0 4px 20px rgba(29,19,12,.32)}
    .section-title p{color:var(--cream-4);opacity:.82}

    .marquee-wrap{mask-image:linear-gradient(90deg,transparent,#000 6%,#000 94%,transparent);-webkit-mask-image:linear-gradient(90deg,transparent,#000 6%,#000 94%,transparent)}
    .card{
      border-color:rgba(234,216,187,.22);
      background:linear-gradient(145deg,rgba(244,231,208,.96),rgba(234,216,187,.94));
      box-shadow:0 20px 52px rgba(29,19,12,.38),inset 0 1px rgba(244,231,208,.09);
    }
    .card:hover{
      transform:translateY(-9px) rotate(-1deg) scale(1.012);
      border-color:rgba(234,216,187,.38);
      box-shadow:0 28px 65px rgba(29,19,12,.48),inset 0 1px rgba(244,231,208,.12);
    }
    .card img{background:var(--cream-5)}

    .buy-wrap{
      position:relative;
      z-index:10;
      background:linear-gradient(180deg,var(--cream-0),var(--cream-1));
      padding-top:18px;
    }
    .buy-btn{
      border-color:rgba(234,216,187,.46);

  <script>
    (() => {
      /* Mobile navigation */
      const nav = document.getElementById("siteNav");
      const toggle = document.getElementById("menuToggle");
      const links = document.getElementById("navLinks");

      function closeMenu(){
        nav.classList.remove("open");
        toggle.setAttribute("aria-expanded","false");
        toggle.setAttribute("aria-label","Open menu");
      }
      toggle.addEventListener("click", () => {
        const open = nav.classList.toggle("open");
        toggle.setAttribute("aria-expanded", String(open));
        toggle.setAttribute("aria-label", open ? "Close menu" : "Open menu");
      });
      links.addEventListener("click", event => {
        if(event.target.matches("a")) closeMenu();
      });
      document.addEventListener("click", event => {
        if(!nav.contains(event.target)) closeMenu();
      });
      document.addEventListener("keydown", event => {
        if(event.key === "Escape") closeMenu();
      });

      /* Flame circumference */
      const flameRing = document.getElementById("flameRing");
      const flameCount = 28;
      const frag = document.createDocumentFragment();
      for(let n = 0; n < flameCount; n++){
        const flame = document.createElement("i");
        flame.className = "flame";
        flame.style.setProperty("--a", `${n * (360 / flameCount)}deg`);
        flame.style.setProperty("--d", `${-(n % 7) * 0.12}s`);
        frag.appendChild(flame);
      }
      flameRing.appendChild(frag);

      /* OM audio starts after the first user interaction */
      const omAudio = document.getElementById("omAudio");
      omAudio.volume = 0.42;
      let omStarted = false;

      async function startOmOnFirstInteraction(){
        if(omStarted) return;
        try{
          await omAudio.play();
          omStarted = true;
          removeAudioListeners();
        }catch(err){}
      }
      function removeAudioListeners(){
        ["scroll","pointerdown","touchstart","keydown"].forEach(type => {
          window.removeEventListener(type,startOmOnFirstInteraction);
        });
      }
      ["scroll","pointerdown","touchstart","keydown"].forEach(type => {
        window.addEventListener(type,startOmOnFirstInteraction,{passive:true});
      });

      /* Mantras */
      const mantras = [
        "ॐ भूर्भुवः स्वः तत्सवितुर्वरेण्यं भर्गो देवस्य धीमहि धियो यो नः प्रचोदयात्॥",
        "ॐ त्र्यम्बकं यजामहे सुगन्धिं पुष्टिवर्धनम् उर्वारुकमिव बन्धनान्मृत्योर्मुक्षीय मामृतात्॥",
        "ॐ नमः शिवाय॥",
        "ॐ सह नाववतु। सह नौ भुनक्तु। सह वीर्यं करवावहै॥",
        "ॐ शान्तिः शान्तिः शान्तिः॥"
      ];
      const mantraOm = document.getElementById("mantraOm");
      const mantraText = document.getElementById("mantraText");
      let i = 0;

      function showMantra(){
        mantraOm.classList.remove("show");
        mantraText.classList.remove("show");

        /* Put the mantra into the DOM immediately.
           The CSS keeps it visible; the animation is only decorative. */
        mantraText.textContent = mantras[i];

        void mantraOm.offsetWidth;
        void mantraText.offsetWidth;

        mantraOm.classList.add("show");
        mantraText.classList.add("show");

        i = (i + 1) % mantras.length;
      }

      showMantra();
      window.setInterval(showMantra,5000);
    })();
  </script>
