      top:50%;

      display:block;
    }

      left:clamp(-30px,1vw,24px);

      width:clamp(290px,38vw,510px);
      height:clamp(290px,38vw,510px);
    }

    /* Extra animated water makes the offering visibly split around the OM. */
    .water-split{
      position:absolute;
      left:50%;
      top:53%;
      width:clamp(220px,31vw,380px);
      height:130px;
      transform:translate(-50%,-50%);
      z-index:6;
      pointer-events:none;
    }

    .split-stream{
      position:absolute;
      top:45%;
      width:46%;
      height:4px;
      border-radius:999px;
      background:linear-gradient(90deg,rgba(255,255,255,0),rgba(177,235,255,.95),rgba(255,255,255,.18));
      box-shadow:0 0 8px rgba(130,220,255,.8),0 0 18px rgba(80,190,255,.35);
      opacity:.9;
      animation:waterSplit 1.8s ease-in-out infinite;
    }

    .split-left{
      right:50%;
      transform-origin:right center;
      transform:rotate(18deg);
    }

    .split-right{
      left:50%;
      transform-origin:left center;
      transform:rotate(-18deg);
      background:linear-gradient(90deg,rgba(255,255,255,.18),rgba(177,235,255,.95),rgba(255,255,255,0));
    }

    .water-split i{
      position:absolute;
      width:4px;
      height:4px;
      border-radius:50%;
      background:#dff8ff;
      box-shadow:0 0 8px #8ee5ff;
      left:50%;
      top:47%;
      opacity:0;
      animation:waterDroplet 1.8s ease-out infinite;
    }

    .water-split i:nth-of-type(1){--dx:-70px;--dy:-35px;animation-delay:.05s}
    .water-split i:nth-of-type(2){--dx:72px;--dy:-30px;animation-delay:.25s}
    .water-split i:nth-of-type(3){--dx:-105px;--dy:5px;animation-delay:.45s}
    .water-split i:nth-of-type(4){--dx:110px;--dy:8px;animation-delay:.65s}
    .water-split i:nth-of-type(5){--dx:-135px;--dy:35px;animation-delay:.85s}
    .water-split i:nth-of-type(6){--dx:140px;--dy:32px;animation-delay:1.05s}
    .water-split i:nth-of-type(7){--dx:-92px;--dy:-8px;animation-delay:1.25s}
    .water-split i:nth-of-type(8){--dx:94px;--dy:-4px;animation-delay:1.45s}

    @keyframes waterSplit{
      0%,100%{opacity:.35;filter:blur(.2px);transform:rotate(18deg) scaleX(.72)}
      50%{opacity:1;filter:blur(0);transform:rotate(18deg) scaleX(1.08)}
    }

    .split-right{animation-name:waterSplitRight}

    @keyframes waterSplitRight{
      0%,100%{opacity:.35;filter:blur(.2px);transform:rotate(-18deg) scaleX(.72)}
      50%{opacity:1;filter:blur(0);transform:rotate(-18deg) scaleX(1.08)}
    }

    @keyframes waterDroplet{
      0%{opacity:0;transform:translate(0,0) scale(.5)}
      18%{opacity:1}
      100%{opacity:0;transform:translate(var(--dx),var(--dy)) scale(1.25)}
    }

    .om-orbit{
      position:relative;
      width:clamp(310px,42vw,560px);
      height:clamp(310px,42vw,560px);
      display:grid;
      place-items:center;
      isolation:isolate;
      flex:0 0 auto;
    }

    /* Soft sacred light sits behind every other OM layer. */
    .om-light{
      position:absolute;
      width:72%;
      height:72%;
      border-radius:50%;
      z-index:0;
      background:radial-gradient(circle,
        rgba(255,225,135,.58) 0%,
        rgba(255,181,55,.28) 24%,
        rgba(226,125,28,.12) 48%,
        transparent 72%);
      filter:blur(24px);
      transform:translateY(34px) scale(1.15);
      animation:omLightPulse 2.4s ease-in-out infinite alternate;
      pointer-events:none;
    }

    /* Brown circular layer directly behind the OM glyph. */
    .om-disc{
      position:absolute;
      width:64%;
      height:64%;
      border-radius:50%;
      z-index:1;
      background:
        radial-gradient(circle at 35% 30%,rgba(150,91,38,.98),rgba(84,42,17,.98) 68%,rgba(49,23,10,.98));
      border:2px solid rgba(244,198,107,.32);
      box-shadow:
        0 0 0 10px rgba(75,37,14,.18),
        0 0 38px rgba(255,164,45,.25),
        inset 0 0 35px rgba(24,10,3,.55);
      animation:discPulse 2.4s ease-in-out infinite alternate;
      pointer-events:none;
    }

    .om-triangles{
      position:absolute;
      inset:0;
      z-index:2;
      border-radius:50%;
      animation:triangleOrbit 14s linear infinite;
      pointer-events:none;
    }

    .om-triangle{
      position:absolute;
      left:50%;
      top:50%;
      width:0;
      height:0;
      border-left:9px solid transparent;
      border-right:9px solid transparent;
      border-bottom:24px solid rgba(243,198,107,.9);
      filter:drop-shadow(0 0 6px rgba(255,180,55,.48));
      transform:
        rotate(var(--angle))
        translateY(calc(clamp(155px,21vw,280px) * -1));
      transform-origin:50% 0;
    }

    .om-triangle:nth-child(even){
      border-bottom-color:rgba(176,103,37,.95);
      border-left-width:7px;
      border-right-width:7px;
      border-bottom-width:19px;
    }

    .om-orbit .om{
      position:relative;
      z-index:3;
      margin:0;
    }

    @keyframes triangleOrbit{
      from{transform:rotate(0deg)}
      to{transform:rotate(360deg)}

  <!-- Background Om audio. It starts only after the visitor gives permission. -->
  <audio id="omAudio" src="om.mp3" loop preload="auto" aria-label="ॐ background sound"></audio>

  <script>
    const omAudio = document.getElementById("omAudio");
    omAudio.volume = 0.42;

    // Browsers block autoplay until the visitor interacts with the page.
    // The very first scroll, click, touch, or keyboard interaction starts OM.
    let omStarted = false;

    async function startOmOnFirstInteraction(){
      if(omStarted) return;
      omStarted = true;

      try{
        await omAudio.play();
      }catch(err){
        // If the browser still blocks playback, allow the next interaction to retry.
        omStarted = false;
      }

      removeOmInteractionListeners();
    }

    function removeOmInteractionListeners(){
      window.removeEventListener("scroll", startOmOnFirstInteraction);
      window.removeEventListener("pointerdown", startOmOnFirstInteraction);
      window.removeEventListener("touchstart", startOmOnFirstInteraction);
      window.removeEventListener("keydown", startOmOnFirstInteraction);
    }

    window.addEventListener("scroll", startOmOnFirstInteraction, {passive:true, once:false});
    window.addEventListener("pointerdown", startOmOnFirstInteraction, {passive:true, once:false});
    window.addEventListener("touchstart", startOmOnFirstInteraction, {passive:true, once:false});
    window.addEventListener("keydown", startOmOnFirstInteraction, {passive:true, once:false});

    // Create a denser, evenly spaced triangular ring around the OM disc.
    const triangleRing = document.querySelector(".om-triangles");
    const TRIANGLE_COUNT = 24;
    for(let n = 0; n < TRIANGLE_COUNT; n++){
      const triangle = document.createElement("span");
      triangle.className = "om-triangle";
      triangle.style.setProperty("--angle", `${n * (360 / TRIANGLE_COUNT)}deg`);
      triangleRing.appendChild(triangle);
    }

    const mantras = [
      "ॐ भूर्भुवः स्वः तत्सवितुर्वरेण्यं भर्गो देवस्य धीमहि धियो यो नः प्रचोदयात्॥",
      "ॐ त्र्यम्बकं यजामहे सुगन्धिं पुष्टिवर्धनम् उर्वारुकमिव बन्धनान्मृत्योर्मुक्षीय मामृतात्॥",
      "ॐ नमः शिवाय॥",
      "ॐ सह नाववतु। सह नौ भुनक्तु। सह वीर्यं करवावहै॥",
      "ॐ शान्तिः शान्तिः शान्तिः॥"
    ];

    const om = document.getElementById("mantraOm");
    const text = document.getElementById("mantraText");
    let i = 0;

    function showMantra(){
      om.classList.remove("show");
      text.classList.remove("show");
      void om.offsetWidth;
      void text.offsetWidth;

      om.classList.add("show");
      setTimeout(() => {
        text.textContent = mantras[i];
        text.classList.add("show");
      }, 650);

      i = (i + 1) % mantras.length;
    }

    showMantra();
    setInterval(showMantra, 5000);
  </script>
